
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEGA RUMBA FITNESS - Lector QR</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
body {
  margin:0; padding:20px;
  background:#100d18; color:white;
  font-family:Arial,sans-serif;
}
main {max-width:520px;margin:auto}
h1 {color:#f6c84b;text-align:center}
input,button {
  width:100%;box-sizing:border-box;
  padding:15px;margin:8px 0;
  border:0;border-radius:10px;font-size:16px;
}
input {background:white;color:#111}
button {background:#e6b83e;font-weight:bold;cursor:pointer}
#reader {background:white;border-radius:12px;margin-top:15px;overflow:hidden}
#result {background:#292333;padding:18px;border-radius:12px;margin-top:15px}
.ok {background:#075c36!important}
.bad {background:#8a2028!important}
</style>
</head>
<body>
<main>
<h1>MEGA RUMBA FITNESS</h1>
<p>Escáner oficial de entradas</p>

<label>PIN del personal</label>
<input id="pin" type="password" placeholder="Escribe el PIN">

<button id="start">ACTIVAR CÁMARA Y ESCANEAR</button>
<button id="stop" style="display:none">DETENER CÁMARA</button>

<div id="reader"></div>
<div id="result">Esperando escaneo...</div>
</main>

<script>
const API_URL = "https://mega-rumba-checkin.taverasshop15.workers.dev";

let scanner = null;
let busy = false;


function mostrar(r) {
  const el = document.getElementById("result");
  el.className = r.ok ? "ok" : "bad";
  el.replaceChildren();

  const title = document.createElement("h2");
  title.textContent = r.status || "RESULTADO";
  el.appendChild(title);

  const name = document.createElement("h2");
  name.textContent = r.nombre || "";
  el.appendChild(name);

  const info = document.createElement("p");
  info.textContent = (r.folio || "") + " · " + (r.grupo || "");
  el.appendChild(info);

  if (r.ok && r.grupo) {
    const colores = {
      "Azul": ["#2563eb", "#ffffff"],
      "Rojo": ["#dc2626", "#ffffff"],
      "Verde": ["#16a34a", "#ffffff"],
      "Amarillo": ["#eab308", "#171421"],
      "Azul claro": ["#7dd3fc", "#171421"],
      "Morado": ["#8b5cf6", "#ffffff"],
      "Naranja": ["#f97316", "#171421"],
      "Rosado": ["#f472b6", "#171421"],
      "Gris": ["#9ca3af", "#171421"],
      "Negro": ["#111827", "#ffffff"],
      "Fucsia": ["#d946ef", "#171421"],
      "Menta": ["#6ee7b7", "#171421"],
      "Blanco": ["#f8fafc", "#171421"],
      "Magenta": ["#c026d3", "#ffffff"],
      "Plateado": ["#cbd5e1", "#171421"],
      "Celeste": ["#38bdf8", "#171421"],
      "Turquesa": ["#14b8a6", "#171421"]
    };

    const grupo = String(r.grupo).trim();
    const color = colores[grupo] || ["#e6b83e", "#171421"];

    const manilla = document.createElement("div");
    manilla.style.background = color[0];
    manilla.style.color = color[1];
    manilla.style.padding = "20px 10px";
    manilla.style.borderRadius = "12px";
    manilla.style.margin = "18px 0";
    manilla.style.textAlign = "center";
    manilla.style.fontWeight = "bold";
    manilla.style.fontSize = "22px";
    manilla.textContent = "ENTREGAR MANILLA " + grupo.toUpperCase();

    el.appendChild(manilla);
  }

  const msg = document.createElement("p");
  msg.textContent = r.message || "";
  el.appendChild(msg);
}


async function consultar(token) {
  const respuesta = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      token: token,
      pin: document.getElementById("pin").value
    })
  });

  if (!respuesta.ok) {
    throw new Error("No se pudo conectar con el sistema.");
  }

  return await respuesta.json();
}

async function procesarQR(token) {
  if (busy) return;
  busy = true;
  if (scanner) scanner.pause(true);

  try {
    const resultado = await consultar(token);
    mostrar(resultado);
  } catch (error) {
    mostrar({
      ok:false,
      status:"ERROR DE CONEXIÓN",
      message:error.message
    });
  }

  setTimeout(() => {
    busy = false;
    if (scanner) scanner.resume();
  }, 2500);
}

document.getElementById("start").onclick = async () => {
  if (!document.getElementById("pin").value.trim()) {
    alert("Escribe el PIN del personal.");
    return;
  }

  try {
    if (!scanner) scanner = new Html5Qrcode("reader");

    await scanner.start(
      {facingMode:"environment"},
      {fps:10, qrbox:{width:240,height:240}},
      procesarQR,
      () => {}
    );

    document.getElementById("start").style.display="none";
    document.getElementById("stop").style.display="block";

    mostrar({
      ok:true,
      status:"CÁMARA ACTIVA",
      message:"Acerca una entrada QR a la cámara."
    });

  } catch(error) {
    mostrar({
      ok:false,
      status:"CÁMARA NO DISPONIBLE",
      message:String(error)
    });
  }
};

document.getElementById("stop").onclick = async () => {
  if (scanner) {
    await scanner.stop();
    document.getElementById("start").style.display="block";
    document.getElementById("stop").style.display="none";
  }
};
</script>
</body>
</html>
